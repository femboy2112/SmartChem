name: Bug report
description: A software defect — a crash, a wrong exit code, an interface that misbehaves.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a **scientific-correctness / overclaim** problem (false vouch, false FIT,
        identity hallucination, provenance mismatch), use the *Scientific correctness*
        form instead. For a **security vulnerability**, do **not** file a public issue —
        see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The exact command(s) and input. A minimal repro is best.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SmartChem version
      description: Output of `smartchem --version`.
      placeholder: smartchem 1.0.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / environment
      placeholder: "Ubuntu 24.04"
    validations:
      required: false
