name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # The xfail ratchet was discharged on 2026-07-20 when the legacy engine was retired:
      # every finding now has an explicit verdict in tests/test_findings.py, either
      # DISCHARGED (asserted against the live system, unmarked) or DROPPED (asserted
      # absent). -rs surfaces what was skipped, so a silently-skipped suite cannot read
      # as a green one.
      #
      # Tests needing real quantum-chemistry calls are gated behind --runslow and are NOT
      # run here: PySCF is not installed on this runner, and a test that would be skipped
      # anyway should say so rather than appear to pass.
      - name: Test
        run: pytest -q -rs

      # The benchmark is informational on the core install (no optional QC backends
      # available here), but it must not crash, and its coverage line must stay honest.
      - name: Benchmark (baseline oracles only)
        run: python -m smartchem.bench --split test --quiet
