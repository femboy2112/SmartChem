name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege default token: nothing here writes to the repository through GITHUB_TOKEN.
# (The upload-artifact step below writes to the Actions artifact store, not the git contents API.)
# A job that ever needs more should widen permissions at the job level, not here.
permissions:
  contents: read

# Hosted runners allocate again: run 36922045140 (2026-10-01) executed every job below. The
# earlier billing outage, when no runner started, is recorded in docs/CI_INFRASTRUCTURE_BLOCKER.md.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # The legacy-finding xfail ratchet was discharged on 2026-07-20, and the last strict xfail --
      # true parallel interchange -- was retired by PR #79: the interchange law holds on the
      # OpenChemDiagram backbone under canonicalize (linear Reaction is its lossy trace by theorem), so
      # the debt is DISCHARGED, not open. The suite now carries ZERO xfail markers; -rs surfaces skips.
      #
      # Tests needing real quantum-chemistry calls are gated behind --runslow and are NOT
      # run here: PySCF is not installed on this runner, and a test that would be skipped
      # anyway should say so rather than appear to pass.
      # The monolithic `pytest` is OOM-killed on a ~7 GB box (it accumulates memory across 290
      # files), so run the OOM-safe batched runner: heavy files solo, a fresh pytest process per
      # batch, exit 0 iff every batch passed. A failed batch prints a bounded excerpt of its log;
      # the full logs and junit xml go to LOGDIR, uploaded below when the job fails.
      - name: Test
        run: LOGDIR="$RUNNER_TEMP/smartchem-suite" PY="$(command -v python)" scripts/run_suite.sh

      - name: Upload suite logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: suite-logs-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/smartchem-suite
          if-no-files-found: ignore

      # The benchmark is informational on the core install (no optional QC backends
      # available here), but it must not crash, and its coverage line must stay honest.
      - name: Benchmark (baseline oracles only)
        run: python -m smartchem.bench --split test --quiet

  # Build the wheel + sdist from a clean source export
  # of HEAD and prove the INSTALLED artifact behaves byte-for-byte like the source tree
  # (console scripts, package data, implementation digest) for this job's Python.
  wheel-install-matrix:
    name: Wheel install matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv and the source-tree reference environment
        run: |
          python -m pip install --upgrade pip uv
          pip install -e .

      - name: Build reproducible release artifacts
        run: python scripts/build_release.py --out "$RUNNER_TEMP/release"

      - name: Install matrix
        run: >-
          python experiments/v0_9_5_install_matrix.py
          --wheel "$RUNNER_TEMP"/release/*.whl --sdist "$RUNNER_TEMP"/release/*.tar.gz
          --source-tree "$PWD" --source-python "$(command -v python)"
          --out "$RUNNER_TEMP/matrix" --work "$RUNNER_TEMP/matrix-venvs"

  pyscf-smoke:
    name: Optional PySCF backend (smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install core, test, and PySCF dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,qc]'

      # Keep expensive wavefunction calculations behind the explicit --runslow gate,
      # but prove that the optional backend imports, registers, and coexists with every
      # fast core test. A missing or broken PySCF install must fail rather than skip.
      - name: Verify PySCF discovery and one real calculation
        run: >-
          python -c 'from smartchem.oracle import available_oracles;
          from smartchem.category import Molecule;
          from smartchem.oracle.pyscf_oracle import PYSCF_AVAILABLE, PySCFOracle;
          assert PYSCF_AVAILABLE and "ccsdt-cbs" in available_oracles();
          result = PySCFOracle("HF", "cc-pVDZ", max_atoms=1).energy(Molecule.atom("H"));
          assert result is not None and result.method.startswith("HF/cc-pVDZ")'

      - name: Test fast suite with PySCF available
        run: pytest -q -rs -m "not slow"

      # This job is the ONLY place the benchmark can fail, so it is the only place the
      # benchmark means anything. The core `test` job runs it with no backend, so it
      # exercises the heuristic oracle and nothing else -- which is exactly how the
      # iodine defect survived: I2/HI/ICl are curated reference rows, PySCF has no
      # cc-pVTZ for iodine, and the coverage guard consulted the ground-state-spin table
      # instead of the basis library. `python -m smartchem.bench` therefore exited 1 with
      # an uncaught BasisNotFoundError on every developer machine with the backend
      # installed, and CI could not see it. A check blind on the path where it can fail
      # is not a check.
      #
      # SCOPED TO THE CHEAPEST TIER, AND THE SCOPE IS MEASURED RATHER THAN GUESSED.
      #
      # The first version of this step ran every available oracle and was given 30
      # minutes. That was never timed. It does not fit: a local run on 8 cores at
      # OMP_NUM_THREADS=1 was killed by a 3000 s wall with 8 of 11 species still to go in
      # the cbs(TZ,QZ) tier, having already spent 2580 s of per-species time. Si2 alone
      # costs 1433 s at cc-pVQZ. The full four-tier test split is hours, not minutes, so
      # the step as written would have failed by timeout on every run -- a red gate that
      # proves nothing, which is a worse failure than the blind gate it replaced.
      #
      # heuristic + ccsdt-tz is the cheapest pair that still exercises what this step is
      # for: the bench module end to end, the COVERAGE and VERDICT reporting, and every
      # curated reference row reaching a decision on a real backend. Measured at 165 s
      # wall / 1.02 GB peak RSS on a CONTENDED box, declining 3 of 11 (I2, K2, KCl) at
      # ccsdt-tz exactly as the coverage guard requires. The budget below is ~5x that.
      #
      # The expensive tiers are not silently dropped -- they are simply not a per-push
      # gate. What this step cannot catch is a defect specific to cc-pVQZ or the
      # extrapolated tier; that belongs behind workflow_dispatch, not on every commit.
      - name: Benchmark must survive the real backend
        timeout-minutes: 15
        run: >-
          python -m smartchem.bench --split test --quiet
          --oracle heuristic --oracle ccsdt-tz

      # Manual dispatch buys coverage of the expensive analytic-gradient and Hessian
      # interfaces without charging every pull request for repeated wavefunction work.
      # These are selected integration cases, not the full research benchmark.
      - name: Manual real-wavefunction geometry integration
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 45
        run: >-
          pytest -q -rs --runslow
          tests/test_geometry.py::TestAgainstARealWavefunction::test_water_relaxes_to_the_known_hartree_fock_geometry
          tests/test_geometry.py::TestAgainstARealWavefunction::test_the_vibrational_analysis_agrees_with_pyscf_exactly
