name: Codex workspace export

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source tree
        run: tar --exclude=.git --exclude=smartchem-source.tgz -czf smartchem-source.tgz .
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: smartchem-source-${{ github.sha }}
          path: smartchem-source.tgz
          retention-days: 1
