name: Codex workspace export

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source tree
        run: git archive --format=tar.gz --output=/tmp/smartchem-source.tgz HEAD
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: smartchem-source-${{ github.sha }}
          path: /tmp/smartchem-source.tgz
          retention-days: 1
