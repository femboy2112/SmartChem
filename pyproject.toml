[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smartchem"
dynamic = ["version"]
description = "A reality-respecting chemical route compiler: bounded search, evidence-gated readiness and capability verdicts, and a verified JSON wire contract, over a conserving reaction algebra with pluggable energy oracles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]
# Non-license classifiers only: with the SPDX `license = "MIT"` expression above, a `License ::` trove
# classifier is deprecated (PEP 639) and setuptools>=77 would reject the duplicate declaration.
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/femboy2112/SmartChem"
Changelog = "https://github.com/femboy2112/SmartChem/blob/main/CHANGELOG.md"
Compatibility = "https://github.com/femboy2112/SmartChem/blob/main/COMPATIBILITY.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.90",
]
# High-accuracy energy oracles. Optional: the categorical core runs without them.
qc = ["pyscf>=2.4"]

# The decoupled probe-evidence bridge as an installed command, so external consumers
# (fine-man and the like) get `smartchem-verify-probes` on their PATH after install,
# matching the CLI's own prog name and its documented `python -m smartchem.evidence` form.
[project.scripts]
smartchem = "smartchem.cli:main"
smartchem-verify-probes = "smartchem.evidence.cli:main"

[tool.setuptools.dynamic]
# Single source of truth: smartchem/__init__.py.  `attr` is resolved by a static AST read
# (no import, so building never needs numpy/scipy); a literal assignment is required there.
version = {attr = "smartchem.__version__"}

# experiments/ is kept in git for harness reproducibility but is not part of the installable
# API, so it is deliberately excluded from the built distribution. The test suite still
# imports it directly from the source tree (pytest runs from the repo root).
[tool.setuptools.packages.find]
include = ["smartchem*"]

# Ship the machine-readable manifest contract and the consumer guide with the package,
# so an adopter who `pip install`s SmartChem can validate manifests against the schema the
# bridge points them at, without cloning the repo for one JSON file.
[tool.setuptools.package-data]
"smartchem.evidence" = ["manifest.schema.json", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: benchmarks and oracle calls that take real time",
    "optional_backend: requires pyscf",
]
